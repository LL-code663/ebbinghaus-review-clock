<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>单词复习钟 · Vocab Review Clock</title>
<meta name="description" content="A silent spaced-repetition reminder for vocabulary, following the Ebbinghaus forgetting curve (5 min, 30 min, 12 h or tonight, 1, 2, 4, 7, 15 days) or your own custom plan. 按艾宾浩斯遗忘曲线静音提醒复习单词，可自定义复习方案。">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='34' r='24' fill='%231E6B59'/%3E%3Cpath d='M32 20v15l10 6' stroke='%23fff' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='34' r='24' fill='none' stroke='%23F5C542' stroke-width='4' stroke-dasharray='6 9'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#EDF1EF; --surface:#FFFFFF; --sunk:#F5F8F7; --ink:#15211F; --muted:#5A6A66; --line:#D3DCD9;
  --accent:#1E6B59; --accent-ink:#FFFFFF; --accent-soft:#DCEDE7;
  --due:#F5C542; --due-ink:#3A2D00; --due-soft:#FFF4D2;
  --danger:#B3261E; --shadow:0 18px 50px -18px rgba(12,40,34,.35);
  --serif:"Noto Serif SC","Songti SC","STSong",Georgia,serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1513; --surface:#16201D; --sunk:#121A18; --ink:#E4ECE9; --muted:#93A39E; --line:#2A3733;
    --accent:#5CC3A5; --accent-ink:#08130F; --accent-soft:#1B3029;
    --due:#E9BA2A; --due-ink:#1C1500; --due-soft:#2E2710;
    --danger:#F2867D; --shadow:0 18px 50px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1513; --surface:#16201D; --sunk:#121A18; --ink:#E4ECE9; --muted:#93A39E; --line:#2A3733;
  --accent:#5CC3A5; --accent-ink:#08130F; --accent-soft:#1B3029;
  --due:#E9BA2A; --due-ink:#1C1500; --due-soft:#2E2710;
  --danger:#F2867D; --shadow:0 18px 50px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:calc(env(safe-area-inset-top,0px) + 28px) calc(env(safe-area-inset-bottom,0px) + 40px)}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.brand h1{font-family:var(--serif);font-weight:900;font-size:clamp(28px,5vw,40px);letter-spacing:.02em;line-height:1.15}
.brand p{margin:6px 0 0;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);white-space:nowrap}
.chip b{font-weight:500;color:var(--ink)}
.chip svg{width:14px;height:14px;flex:none}
.lang{cursor:pointer;font-weight:700;color:var(--ink)}
.lang:hover{border-color:var(--muted)}

.strip{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;overflow-x:auto}
.strip ol{list-style:none;margin:0;padding:0;display:grid}
.strip li{position:relative;padding-top:18px;font-size:12.5px;color:var(--muted);padding-right:6px}
.strip li::before{content:"";position:absolute;top:4px;left:0;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.strip li::after{content:"";position:absolute;top:8px;left:12px;right:4px;height:1px;background:var(--line)}
.strip li:last-child::after{display:none}
.strip li strong{display:block;color:var(--ink);font-family:var(--mono);font-weight:700;font-size:14px}

.duebar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;background:var(--due-soft);border:1px solid var(--due);border-radius:14px;padding:12px 16px}

.grid{display:grid;grid-template-columns:1fr;gap:22px;align-items:start}
@media (min-width:860px){.grid{grid-template-columns:340px 1fr}.side{position:sticky;top:16px}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.side{display:flex;flex-direction:column;gap:16px}
.card h2{font-family:var(--serif);font-size:19px;margin-bottom:12px}
label{display:block;font-size:13px;font-weight:500;margin-bottom:5px}
.field{display:flex;flex-direction:column;margin-bottom:14px}
.field small,.hint{color:var(--muted);font-size:12px;margin-top:4px}
input[type=text],input[type=datetime-local],input[type=time],textarea{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
textarea{resize:vertical;min-height:72px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px;line-height:1.3}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.due{background:var(--due);border-color:var(--due);color:var(--due-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding-inline:8px}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.wide{width:100%}
.preview{margin:4px 0 14px;padding:10px 12px;border-radius:10px;background:var(--sunk);border:1px dashed var(--line);font-size:13px}
.preview p{margin:0 0 6px;color:var(--muted)}
.preview ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
.preview li{display:contents}
.preview span{color:var(--muted)}

.switch{display:flex;align-items:flex-start;gap:10px;cursor:pointer;margin:0 0 14px}
.switch input{margin-top:4px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.switch span{font-weight:400;font-size:13.5px}
.switch em{display:block;font-style:normal;color:var(--muted);font-size:12px}
.seg{display:flex;gap:4px;padding:4px;background:var(--sunk);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.seg-opt{flex:1;margin:0;cursor:pointer;position:relative}
.seg-opt input{position:absolute;opacity:0;pointer-events:none}
.seg-opt span{display:block;text-align:center;padding:6px 8px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg-opt input:checked+span{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg-opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:1px}
.plan-rows{list-style:none;margin:10px 0;padding:0;display:flex;flex-direction:column;gap:6px}
.plan-row{display:grid;grid-template-columns:3.2em 4.6em 1fr auto;gap:6px;align-items:center}
.plan-row .idx{font-size:12px;color:var(--muted);white-space:nowrap}
.plan-row input[type=number],.plan-row select{width:100%;min-width:0;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:6px 7px;font:inherit;font-size:14px;color:inherit}
.plan-row .x{padding:4px 8px}
.plan-row .eve{grid-column:2 / -1;display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin:0 0 2px;font-weight:400;cursor:pointer}
.plan-row .eve input{accent-color:var(--accent);margin:0}
.chip.plan b{color:var(--accent)}
.subhead{font-size:13px;font-weight:700;margin:4px 0 6px;padding-top:12px;border-top:1px solid var(--line)}

.list{display:flex;flex-direction:column;gap:14px}
.list-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.list-head h2{font-family:var(--serif);font-size:21px}
.list-head span{color:var(--muted);font-size:13px}
.batch{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.batch.is-due{border-color:var(--due);box-shadow:0 0 0 3px var(--due-soft)}
.batch-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.batch h3{font-size:17px;font-weight:700;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:12.5px}
.next{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:10px 12px;border-radius:10px;background:var(--sunk)}
.next .when{font-size:14px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.due{background:var(--due);color:var(--due-ink)}
.pill.done{background:var(--accent);color:var(--accent-ink)}
.nodes{list-style:none;margin:0;padding:0;display:grid;gap:8px 4px}
.nodes li{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);text-align:center;line-height:1.2;min-width:0}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center}
.nodes li.done .dot{background:var(--accent);border-color:var(--accent)}
.nodes li.done .dot::after{content:"";width:6px;height:3px;border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:translateY(-1px) rotate(-45deg)}
.nodes li.cur .dot{border-color:var(--accent);border-width:3px}
.nodes li.due .dot{background:var(--due);border-color:var(--due)}
.nodes li.cur,.nodes li.due{color:var(--ink);font-weight:700}
details.words summary{cursor:pointer;color:var(--muted);font-size:13px}
details.words p{margin:6px 0 0;white-space:pre-wrap;font-size:13.5px;overflow-wrap:anywhere;max-height:220px;overflow:auto;background:var(--sunk);padding:8px 10px;border-radius:8px}
.batch-actions{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center}
.empty{border:1px dashed var(--line);border-radius:16px;padding:28px 18px;text-align:center;color:var(--muted);background:var(--surface)}
.empty strong{display:block;color:var(--ink);font-family:var(--serif);font-size:18px;margin-bottom:4px}
details.finished>summary{cursor:pointer;color:var(--muted);font-size:14px;padding:4px 0}
details.finished .list{margin-top:10px}

.notes{color:var(--muted);font-size:13px;line-height:1.7}
.notes h2{font-family:var(--serif);color:var(--ink);font-size:16px;margin-bottom:6px}
.notes ul{margin:0;padding-left:1.2em}
footer{color:var(--muted);font-size:12.5px;text-align:center}

.overlay{position:fixed;inset:0;background:rgba(8,20,17,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{width:min(520px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--surface);border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow)}
.modal-head{padding:18px 20px 12px;border-bottom:1px solid var(--line);background:linear-gradient(var(--due-soft),var(--surface))}
.kicker{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700;text-transform:uppercase}
.modal-head h2{font-family:var(--serif);font-size:24px;margin-top:2px}
.modal-body{padding:12px 20px;display:flex;flex-direction:column;gap:10px}
.mitem{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px}
.mitem-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.mitem h3{font-size:16px;overflow-wrap:anywhere}
.modal-foot{padding:12px 20px 18px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.pop{animation:pop .22s ease-out}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:.6}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1 data-i18n="title"></h1>
      <p data-i18n="tagline"></p>
    </div>
    <div class="chips">
      <span class="chip"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 6h2l3-3v10l-3-3H3z"/><path d="M11 6l4 4M15 6l-4 4"/></svg><span data-i18n-html="chipSilent"></span></span>
      <span class="chip plan" id="planChip"></span>
      <span class="chip" id="storeChip"></span>
      <button class="chip lang" type="button" id="langBtn" aria-label="Switch language / 切换语言"></button>
    </div>
  </header>

  <section class="strip" data-i18n-aria="stripAria">
    <ol id="strip"></ol>
  </section>

  <div id="duebar" class="duebar" hidden></div>

  <div class="grid">
    <aside class="side">
      <form class="card" id="addForm" autocomplete="off">
        <h2 data-i18n="newSet"></h2>
        <div class="field">
          <label for="bName" data-i18n="nameLabel"></label>
          <input type="text" id="bName" maxlength="60" required data-i18n-ph="namePh">
        </div>
        <div class="field">
          <label for="bStart" data-i18n="startLabel"></label>
          <input type="datetime-local" id="bStart" required>
          <small data-i18n="startHint"></small>
        </div>
        <div class="field">
          <label for="bWords" data-i18n="wordsLabel"></label>
          <textarea id="bWords" maxlength="20000" data-i18n-ph="wordsPh"></textarea>
        </div>
        <div class="preview" id="preview" aria-live="polite"></div>
        <button class="btn primary wide" type="submit" data-i18n="start"></button>
      </form>

      <div class="card" id="planCard">
        <h2 data-i18n="planTitle"></h2>
        <div class="seg" role="radiogroup" data-i18n-aria="planTitle">
          <label class="seg-opt"><input type="radio" name="planMode" id="planRec" value="rec"><span data-i18n="planRec"></span></label>
          <label class="seg-opt"><input type="radio" name="planMode" id="planCustom" value="custom"><span data-i18n="planCustom"></span></label>
        </div>
        <p class="hint" id="planRecNote" data-i18n="planRecNote"></p>
        <div id="planEditor" hidden>
          <ol class="plan-rows" id="planRows"></ol>
          <div class="row">
            <button class="btn small" type="button" id="planAdd" data-i18n="planAdd"></button>
            <button class="btn ghost small" type="button" id="planReset" data-i18n="planReset"></button>
          </div>
          <p class="hint" data-i18n="planHint"></p>
        </div>
        <div class="field" style="margin-top:14px">
          <label for="bedtime" data-i18n="bedLabel"></label>
          <input type="time" id="bedtime" value="22:00">
          <small data-i18n="bedHint"></small>
        </div>
      </div>

      <div class="card">
        <h2 data-i18n="settings"></h2>
        <label class="switch" for="notifyToggle">
          <input type="checkbox" id="notifyToggle">
          <span><span data-i18n="notify"></span><em id="notifyNote" data-i18n="notifyNote"></em></span>
        </label>
        <div class="subhead" data-i18n="backup"></div>
        <div class="row">
          <button class="btn small" type="button" id="exportBtn" data-i18n="exportJson"></button>
          <button class="btn small" type="button" id="importBtn" data-i18n="importJson"></button>
          <input type="file" id="importFile" accept="application/json,.json" hidden>
        </div>
        <p class="hint" data-i18n="backupHint"></p>
      </div>
    </aside>

    <main class="list" id="main" aria-live="polite"></main>
  </div>

  <section class="notes card">
    <h2 data-i18n="notesTitle"></h2>
    <ul data-i18n-html="notes"></ul>
  </section>

  <footer data-i18n-html="footer"></footer>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal pop" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="modal-head">
      <div class="kicker" data-i18n="kicker"></div>
      <h2 id="mTitle"></h2>
    </div>
    <div class="modal-body" id="mBody"></div>
    <div class="modal-foot">
      <button class="btn" type="button" id="snoozeBtn" data-i18n="snooze"></button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
  "use strict";
  var REPO_URL = "https://github.com/LL-code663/ebbinghaus-review-clock";

  /* ================= i18n ================= */
  var I18N = {
    zh: {
      htmlLang:"zh-CN", langBtn:"EN", docTitle:"单词复习钟",
      title:"单词复习钟",
      tagline:"按艾宾浩斯遗忘曲线提醒你复习（推荐 8 个节点，可自定义）· 只弹窗，不响铃",
      chipSilent:"<b>静音</b>提醒", chipLocal:"<b>保存</b>在此浏览器", chipNoStore:"<b>无法保存</b>（浏览器禁用了存储）",
      stripAria:"复习节点", round:"第 {n} 轮", bedStrip:"或当晚 {t} 前",
      unitLong:{m:"分钟",h:"小时",d:"天"}, unitShort:{m:"分",h:"时",d:"天"},
      stageLong:"{v} {u}后", stageEve:" / 当晚",
      planChipRec:"<b>推荐</b>方案", planChipCustom:"<b>自定义</b>方案 · {n} 次",
      planTitle:"复习方案", planRec:"推荐（8 次）", planCustom:"自定义",
      planRecNote:"按艾宾浩斯遗忘曲线：5 分钟、30 分钟、12 小时（或当晚）、1、2、4、7、15 天后各复习一次。",
      planAdd:"+ 加一次", planReset:"恢复成推荐方案", planIdx:"第 {n} 次", planEve:"不晚于当晚截止时间",
      planRemove:"删除第 {n} 次", planMax:"最多 {n} 次",
      planHint:"所有时间都从背完那一刻算起，改完会按从早到晚排序。只影响之后新建的组，正在复习的组不变。",
      dueBar:"<strong>{n} 组单词到复习时间了</strong> · {names}", openReminder:"打开提醒", sep:"、",
      newSet:"新背一组单词", nameLabel:"这组叫什么", namePh:"例如：托福 List 3（1–50）",
      startLabel:"背完的时间", startHint:"所有复习时间都从这一刻算起。刚背完就保持默认。",
      wordsLabel:"单词（可选）", wordsPh:"粘贴本组单词，提醒弹窗里可以直接展开复习",
      previewHead:"从这个时间算起，{n} 次复习分别在：", previewPick:"选一个时间来预览复习节点", start:"开始计时",
      settings:"设置", bedLabel:"“当晚”截止时间",
      bedHint:"勾了「不晚于当晚」的那一次（推荐方案里是第 3 次），取「间隔到期」和「当晚这个时间」中更早的那个。",
      notify:"同时发静音系统通知", notifyNote:"页面在后台时也能看到横幅（无声音）",
      notifyUnsupported:"当前浏览器不支持系统通知，会只用页面弹窗提醒",
      notifyDenied:"系统通知没有获得许可，会只用页面弹窗提醒",
      backup:"备份", exportJson:"导出备份", importJson:"导入备份",
      backupHint:"数据只存在这个浏览器里。换电脑或清理浏览器数据前，先导出备份。",
      imported:"已导入 {n} 组", importFail:"这个文件不是有效的备份", exported:"备份已下载",
      listHead:"正在复习", countActive:"{n} 组进行中", countDone:" · {n} 组已完成",

  };

  var MIN = 60e3, HOUR = 60*MIN, DAY = 24*HOUR, SNOOZE = 10*MIN;
  var UNIT_MS = {m:MIN, h:HOUR, d:DAY};
  var UNIT_MAX = {m:999, h:999, d:365};
  var MAX_STAGES = 20;
  /* Recommended plan. Each review: v = amount, u = unit (m/h/d), eve = "no later than tonight's cutoff". */
  var DEFAULT_PLAN = [
    {v:5,u:"m"}, {v:30,u:"m"}, {v:12,u:"h",eve:true}, {v:1,u:"d"},
    {v:2,u:"d"}, {v:4,u:"d"}, {v:7,u:"d"}, {v:15,u:"d"}
  ];

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  var storageOk = true;
  function lsGet(k, d){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ storageOk = false; return d; } }
  function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){ storageOk = false; } }

  var state = {
    batches: lsGet(LS_BATCHES, []),
    settings: Object.assign({bedtime:"22:00", notify:false, lang:null, planMode:"rec", customPlan:null}, lsGet(LS_SET, {})),
    pendingDelete: null
  };
  if (!Array.isArray(state.batches)) state.batches = [];

  function pickLang(){
    var q = (location.search.match(/[?&]lang=(zh|en)/) || [])[1] || (location.hash.match(/^#(zh|en)$/) || [])[1];
    if (q) return q;
    if (state.settings.lang) return state.settings.lang;
    var nav = (navigator.languages && navigator.languages[0]) || navigator.language || "en";
    return /^zh/i.test(nav) ? "zh" : "en";
  }
  var lang = pickLang();
  function L(){ return I18N[lang]; }
  function t(key, p){
    var s = L()[key];
    if (s == null) return key;
    return String(s).replace(/\{(\w+)\}/g, function(_, k){ return p && p[k] != null ? p[k] : ""; });
  }

  /* ================= schedule ================= */
  function stageMs(st){ return st.v * UNIT_MS[st.u]; }
  function validStage(st){
    return st && typeof st === "object" && UNIT_MS.hasOwnProperty(st.u) &&
      typeof st.v === "number" && st.v >= 1 && st.v <= UNIT_MAX[st.u] && Math.floor(st.v) === st.v;
  }
  function normalizePlan(plan){
    var out = (Array.isArray(plan) ? plan : []).filter(validStage)
      .map(function(st){ return {v:st.v, u:st.u, eve:!!st.eve && st.v * UNIT_MS[st.u] < DAY}; })
      .sort(function(a, b){ return stageMs(a) - stageMs(b); })
      .slice(0, MAX_STAGES);
    return out.length ? out : clone(DEFAULT_PLAN);
  }
  /* Sets created before custom plans existed have no `stages`: they use the recommended plan. */
  function planOf(b){ return Array.isArray(b.stages) && b.stages.length ? b.stages : DEFAULT_PLAN; }
  function currentPlan(){ return state.settings.planMode === "custom" ? normalizePlan(state.settings.customPlan) : DEFAULT_PLAN; }
  function dueAt(b, i){
    var st = planOf(b)[i], base = b.start + stageMs(st);
    if (!st.eve) return base;
    var hm = String(b.bedtime || "22:00").split(":");
    var d = new Date(b.start); d.setHours(+hm[0] || 0, +hm[1] || 0, 0, 0);
    var bed = d.getTime();
    var prev = i > 0 ? dueAt(b, i - 1) : b.start;
    var minBed = prev + 30*MIN;                    // keep at least 30 min after the previous review
    return (bed >= minBed && bed < base) ? bed : base;
  }
  function stageLabel(st, kind){
    var x = L();
    if (kind === "short") return st.v + x.unitShort[st.u];
    var unit = (st.u === "d" && st.v === 1 && x.unitLong.d1) ? x.unitLong.d1 : x.unitLong[st.u];
    if (kind === "strip") return st.v + " " + unit;
    return t("stageLong", {v:st.v, u:unit}) + (st.eve ? x.stageEve : "");
  }
  function curStage(b){ return b.done.findIndex(function(x){ return !x; }); }
  function isDue(b, now){ var i = curStage(b); return i >= 0 && now >= dueAt(b, i) && now >= (b.snooze || 0); }
  function dueList(now){ return state.batches.filter(function(b){ return isDue(b, now); }); }

  /* ================= formatting ================= */
  function pad(n){ return String(n).padStart(2, "0"); }
  function hm(d){
    if (lang === "zh") return pad(d.getHours()) + ":" + pad(d.getMinutes());
    return d.toLocaleTimeString("en-US", {hour:"numeric", minute:"2-digit"});
  }
  function fmtAbs(ts){
    var d = new Date(ts), now = new Date();
    var day0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    var diff = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime() - day0) / DAY);
    var x = L();
    if (diff === 0) return x.today + " " + hm(d);
    if (diff === 1) return x.tomorrow + " " + hm(d);
    if (diff === 2 && x.dayAfter) return x.dayAfter + " " + hm(d);
    if (diff === -1) return x.yesterday + " " + hm(d);
    if (lang === "zh") return (d.getMonth()+1) + "月" + d.getDate() + "日 周" + x.weekdays[d.getDay()] + " " + hm(d);
    return d.toLocaleDateString("en-US", {weekday:"short", month:"short", day:"numeric"}) + ", " + hm(d);
  }
  function fmtRel(ms){
    ms = Math.max(0, ms);
    if (ms < MIN) return t("relLt1");
    if (ms < HOUR) return t("relMin", {m: Math.round(ms/MIN)});
    if (ms < DAY){ var h = Math.floor(ms/HOUR), m = Math.round((ms % HOUR)/MIN); if (m === 60){ h++; m = 0; } return m ? t("relHourMin", {h:h, m:m}) : t("relHour", {h:h}); }
    var dd = Math.floor(ms/DAY), hh = Math.round((ms % DAY)/HOUR); if (hh === 24){ dd++; hh = 0; }
    return hh ? t("relDayHour", {d:dd, h:hh}) : t("relDay", {d:dd});
  }
  function toLocalInput(ts){ var d = new Date(ts); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes()); }

  var toastTimer;
  function toast(msg){ var el = $("toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.hidden = true; }, 3200); }

  /* ================= storage ================= */
  function save(){ lsSet(LS_BATCHES, state.batches); }
  function upsert(b){
    var i = state.batches.findIndex(function(x){ return x.id === b.id; });
    if (i >= 0) state.batches[i] = b; else state.batches.push(b);
    save(); render();
  }
  window.addEventListener("storage", function(e){
    if (e.key === LS_BATCHES){ state.batches = lsGet(LS_BATCHES, []); render(); check(); }
  });
  function validBatch(b){
    return b && typeof b === "object" && typeof b.id === "string" && typeof b.name === "string" &&
      typeof b.start === "number" && isFinite(b.start) && Array.isArray(b.done) &&
      (b.stages == null ? b.done.length === DEFAULT_PLAN.length
        : Array.isArray(b.stages) && b.stages.length > 0 && b.stages.every(validStage) && b.done.length === b.stages.length);
  }

  function downloadFile(name, text, type){
    var url = URL.createObjectURL(new Blob([text], {type: type}));
    var a = document.createElement("a"); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }

  $("exportBtn").addEventListener("click", function(){
    var d = new Date();
    downloadFile("review-clock-backup-" + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + ".json",
      JSON.stringify({app:"ebbinghaus-review-clock", version:1, exportedAt:d.toISOString(), batches:state.batches}, null, 2), "application/json");
    toast(t("exported"));
  });
  $("importBtn").addEventListener("click", function(){ $("importFile").click(); });
  $("importFile").addEventListener("change", function(ev){
    var f = ev.target.files && ev.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function(){
      try {
        var data = JSON.parse(r.result);
        var arr = Array.isArray(data) ? data : data.batches;
        if (!Array.isArray(arr)) throw 0;
        var ok = arr.filter(validBatch);
        if (!ok.length) throw 0;
        ok.forEach(function(b){
          b.done = b.done.map(function(x){ return typeof x === "number" ? x : 0; });
          b.snooze = typeof b.snooze === "number" ? b.snooze : 0;
          b.words = typeof b.words === "string" ? b.words : "";
          b.bedtime = /^\d{1,2}:\d{2}$/.test(b.bedtime) ? b.bedtime : "22:00";
          if (Array.isArray(b.stages)) b.stages = b.stages.map(function(st){ return {v:st.v, u:st.u, eve:!!st.eve}; });
          var i = state.batches.findIndex(function(x){ return x.id === b.id; });
          if (i >= 0) state.batches[i] = b; else state.batches.push(b);
        });
        save(); render(); check(); toast(t("imported", {n: ok.length}));
      } catch(e){ toast(t("importFail")); }
      ev.target.value = "";
    };
    r.readAsText(f);
  });

  /* ================= calendar (.ics) ================= */
  function icsText(b){
    function z(ts){ return new Date(ts).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, ""); }
    function e(s){ return String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n"); }
    var out = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//ebbinghaus-review-clock//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
    var plan = planOf(b);
    for (var i = 0; i < plan.length; i++){
      if (b.done[i]) continue;
      var ts = dueAt(b, i);
      out.push("BEGIN:VEVENT","UID:" + b.id + "-" + i + "@ebbinghaus-review-clock","DTSTAMP:" + z(Date.now()),
        "DTSTART:" + z(ts),"DTEND:" + z(ts + 15*MIN),
        "SUMMARY:" + e(t("icsSummary", {name:b.name, n:i+1, label:stageLabel(plan[i])})),
        "DESCRIPTION:" + e(b.words ? b.words.slice(0, 1500) : t("icsDesc")),
        "TRANSP:TRANSPARENT",
        "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:" + e(t("icsAlarm", {name:b.name})),"TRIGGER:PT0M","END:VALARM","END:VEVENT");
    }
    out.push("END:VCALENDAR");
    return out.join("\r\n");
  }
  function exportIcs(b){
    var safe = (b.name || "words").replace(/[\\\/:*?"<>|]+/g, "_").slice(0, 40);
    downloadFile("review-" + safe + ".ics", icsText(b), "text/calendar");
    toast(t("icsDone"));
  }

  /* ================= silent system notifications ================= */
  var notified = {};
  var canNotify = "Notification" in window;
  function sysNotify(b, i){
    if (!state.settings.notify || !canNotify || Notification.permission !== "granted") return;
    try { new Notification(t("nTitle", {name:b.name}), {body:t("nBody", {n:i+1, label:stageLabel(planOf(b)[i])}), silent:true, tag:b.id}); } catch(e){}
  }

  $("notifyToggle").checked = !!state.settings.notify && canNotify && Notification.permission === "granted";
  $("notifyToggle").addEventListener("change", function(ev){
    var box = ev.target;
    function finish(on, key){ box.checked = on; state.settings.notify = on; lsSet(LS_SET, state.settings); notifyNoteKey = key; $("notifyNote").textContent = t(key); }
    if (!box.checked){ finish(false, "notifyNote"); return; }
    if (!canNotify){ finish(false, "notifyUnsupported"); return; }
    if (Notification.permission === "granted"){ finish(true, "notifyNote"); return; }
    try {
      var p = Notification.requestPermission(function(res){ finish(res === "granted", res === "granted" ? "notifyNote" : "notifyDenied"); });

    ev.preventDefault();

    var start = new Date($("bStart").value).getTime();
    if (!name){ $("bName").focus(); return; }
    if (!isFinite(start)){ $("bStart").focus(); return; }
    var plan = clone(currentPlan());
    var b = {id:"b" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7), name:name,
      words:$("bWords").value.trim(), start:start, bedtime:state.settings.bedtime,
      stages:plan, done:plan.map(function(){ return 0; }), snooze:0, created:Date.now()};
    upsert(b);
    $("bName").value = ""; $("bWords").value = ""; startTouched = false;
    $("bStart").value = toLocalInput(Date.now()); renderPreview();
    toast(t("started", {t: fmtAbs(dueAt(b, 0))}));
    check();
  });

  /* ================= actions ================= */
  function markDone(id){
    var b0 = state.batches.find(function(x){ return x.id === id; }); if (!b0) return;
    var b = clone(b0), i = curStage(b); if (i < 0) return;
    b.done[i] = Date.now(); b.snooze = 0;
    upsert(b);
    var n = curStage(b);

  }

    var now = Date.now();
    dueList(now).forEach(function(b0){ var b = clone(b0); b.snooze = now + SNOOZE; upsert(b); });
    closeModal(); toast(t("snoozed"));
  }
  document.addEventListener("click", function(ev){
    var el = ev.target.closest("[data-act]"); if (!el) return;
    var id = el.getAttribute("data-id"), act = el.getAttribute("data-act");

    else if (act === "del-no"){ state.pendingDelete = null; render(); }

  });

  $("langBtn").addEventListener("click", function(){
    lang = lang === "zh" ? "en" : "zh";
    state.settings.lang = lang; lsSet(LS_SET, state.settings);
    if (/[?&]lang=|^#(zh|en)$/.test(location.search + location.hash)) { try { history.replaceState(null, "", location.pathname); } catch(e){} }
    applyStatic(); modalSig = ""; if (!$("overlay").hidden) openModal(true);
  });

  /* ================= render ================= */
  function applyStatic(){
    document.documentElement.lang = L().htmlLang;
    document.title = L().docTitle;
    [].forEach.call(document.querySelectorAll("[data-i18n]"), function(el){ el.textContent = t(el.getAttribute("data-i18n")); });
    [].forEach.call(document.querySelectorAll("[data-i18n-html]"), function(el){ el.innerHTML = t(el.getAttribute("data-i18n-html"), {repo: REPO_URL}); });
    [].forEach.call(document.querySelectorAll("[data-i18n-ph]"), function(el){ el.placeholder = t(el.getAttribute("data-i18n-ph")); });
    [].forEach.call(document.querySelectorAll("[data-i18n-aria]"), function(el){ el.setAttribute("aria-label", t(el.getAttribute("data-i18n-aria"))); });
    $("notifyNote").textContent = t(notifyNoteKey);
    $("langBtn").textContent = L().langBtn;
    $("storeChip").innerHTML = storageOk ? t("chipLocal") : t("chipNoStore");
    renderStrip(); renderPreview(); renderPlanEditor(); render();
  }
  function bedLabel(){ return lang === "zh" ? state.settings.bedtime : hm(new Date("2000-01-01T" + state.settings.bedtime)); }
  function renderStrip(){
    var plan = currentPlan(), ol = $("strip");
    ol.style.gridTemplateColumns = "repeat(" + plan.length + ",minmax(76px,1fr))";
    ol.style.minWidth = (plan.length * 78) + "px";
    ol.innerHTML = plan.map(function(st, i){
      var sub = st.eve ? t("bedStrip", {t: bedLabel()}) : t("round", {n:i+1});
      return "<li><strong>" + esc(stageLabel(st, "strip")) + "</strong>" + esc(sub) + "</li>";
    }).join("");
    var custom = state.settings.planMode === "custom";
    $("planChip").innerHTML = custom ? t("planChipCustom", {n:plan.length}) : t("planChipRec");
  }

  /* ================= plan editor ================= */
  function editablePlan(){
    if (!Array.isArray(state.settings.customPlan) || !state.settings.customPlan.length) state.settings.customPlan = clone(DEFAULT_PLAN);
    return state.settings.customPlan;
  }
  function savePlan(resort){
    var plan = editablePlan();
    if (resort) state.settings.customPlan = normalizePlan(plan);
    lsSet(LS_SET, state.settings);
    renderStrip(); renderPreview();
    if (resort) renderPlanEditor();
  }
  function renderPlanEditor(){
    var custom = state.settings.planMode === "custom";
    $("planRec").checked = !custom; $("planCustom").checked = custom;
    $("planEditor").hidden = !custom; $("planRecNote").hidden = custom;
    if (!custom) return;
    var plan = editablePlan(), x = L(), one = plan.length <= 1;
    $("planRows").innerHTML = plan.map(function(st, i){
      var opts = ["m","h","d"].map(function(u){ return "<option value='" + u + "'" + (st.u === u ? " selected" : "") + ">" + esc(u === "d" && st.v === 1 && x.unitLong.d1 ? x.unitLong.d1 : x.unitLong[u]) + "</option>"; }).join("");
      var lab = esc(t("planIdx", {n:i+1})), rm = esc(t("planRemove", {n:i+1}));
      return "<li class='plan-row' data-i='" + i + "'>" +
        "<span class='idx'>" + lab + "</span>" +
        "<input type='number' id='planV" + i + "' inputmode='numeric' min='1' max='" + UNIT_MAX[st.u] + "' step='1' value='" + st.v + "' aria-label='" + lab + "'>" +
        "<select id='planU" + i + "' aria-label='" + lab + "'>" + opts + "</select>" +
        "<button class='btn ghost small x' type='button' data-plan-del='" + i + "'" + (one ? " disabled" : "") + " aria-label='" + rm + "' title='" + rm + "'>×</button>" +
        (stageMs(st) < DAY ? "<label class='eve'><input type='checkbox' id='planE" + i + "'" + (st.eve ? " checked" : "") + ">" + esc(t("planEve")) + " (" + esc(bedLabel()) + ")</label>" : "") +
        "</li>";
    }).join("");
    var full = plan.length >= MAX_STAGES;
    $("planAdd").disabled = full;
    $("planAdd").title = full ? t("planMax", {n:MAX_STAGES}) : "";
  }
  function onPlanMode(){
    state.settings.planMode = $("planCustom").checked ? "custom" : "rec";
    if (state.settings.planMode === "custom") editablePlan();
    lsSet(LS_SET, state.settings);
    renderPlanEditor(); renderStrip(); renderPreview();
  }
  $("planRec").addEventListener("change", onPlanMode);
  $("planCustom").addEventListener("change", onPlanMode);
  $("planRows").addEventListener("change", function(ev){
    var row = ev.target.closest(".plan-row"); if (!row) return;
    var i = +row.getAttribute("data-i"), st = editablePlan()[i]; if (!st) return;
    if (ev.target.id === "planE" + i){ st.eve = ev.target.checked; savePlan(false); return; }
    if (ev.target.id === "planU" + i) st.u = ev.target.value;
    var v = Math.round(+$("planV" + i).value);
    st.v = Math.min(UNIT_MAX[st.u], Math.max(1, isFinite(v) ? v : 1));
    savePlan(true);
  });
  $("planRows").addEventListener("click", function(ev){
    var btn = ev.target.closest("[data-plan-del]"); if (!btn) return;
    var plan = editablePlan(); if (plan.length <= 1) return;
    plan.splice(+btn.getAttribute("data-plan-del"), 1);
    savePlan(true);
  });
  $("planAdd").addEventListener("click", function(){
    var plan = editablePlan(); if (plan.length >= MAX_STAGES) return;
    var last = plan[plan.length - 1];
    var next = last ? (last.u === "d" ? {v:Math.min(365, last.v * 2), u:"d"} : {v:1, u:"d"}) : {v:1, u:"d"};
    if (last && last.u === "d" && last.v >= 365) next = {v:365, u:"d"};
    plan.push(next);
    savePlan(true);
    var inputs = $("planRows").querySelectorAll("input[type=number]");
    if (inputs.length) inputs[inputs.length - 1].focus();
  });
  $("planReset").addEventListener("click", function(){
    state.settings.customPlan = clone(DEFAULT_PLAN);
    savePlan(true);
  });
  function renderPreview(){
    var ts = new Date($("bStart").value).getTime();
    if (!isFinite(ts)){ $("preview").innerHTML = "<p>" + esc(t("previewPick")) + "</p>"; return; }
    var plan = currentPlan(), b = {start:ts, bedtime:state.settings.bedtime, stages:plan};
    $("preview").innerHTML = "<p>" + esc(t("previewHead", {n:plan.length})) + "</p><ol>" + plan.map(function(st, i){
      return "<li><span>" + esc(stageLabel(st, "short")) + "</span><b class=\"num\">" + esc(fmtAbs(dueAt(b, i))) + "</b></li>";
    }).join("") + "</ol>";
  }
  function nodesHtml(b, now){
    var c = curStage(b), plan = planOf(b);
    return "<ol class=\"nodes\" style=\"grid-template-columns:repeat(" + Math.min(plan.length, 8) + ",1fr)\">" + plan.map(function(st, i){
      var s = stageLabel(st, "short");
      var cls = b.done[i] ? "done" : (i === c ? (now >= dueAt(b, i) ? "due" : "cur") : "");
      var tip = b.done[i] ? t("tipDone", {t: fmtAbs(b.done[i])}) : t("tipPlan", {t: fmtAbs(dueAt(b, i))});
      return "<li class=\"" + cls + "\" title=\"" + esc(tip) + "\"><span class=\"dot\"></span>" + esc(s) + "</li>";
    }).join("") + "</ol>";
  }
  function batchHtml(b, now){
    var c = curStage(b), id = esc(b.id);
    var dueNow = c >= 0 && now >= dueAt(b, c);
    var next;
    if (c < 0){
      next = "<div class=\"next\"><span class=\"when\">" + esc(t("allDone", {n: b.done.length, t: fmtAbs(Math.max.apply(null, b.done))})) + "</span><span class=\"pill done\">" + esc(t("mastered")) + "</span></div>";
    } else {
      var ts = dueAt(b, c), snoozed = b.snooze && b.snooze > now && dueNow;
      var when = dueNow
        ? t("dueNow", {n:c+1, t:esc(fmtAbs(ts))}) + (now - ts > 5*MIN ? esc(t("late", {r: fmtRel(now - ts)})) : "") + (snoozed ? esc(t("snoozing")) : "")
        : t("upcoming", {n:c+1, t:esc(fmtAbs(ts)), r:esc(fmtRel(ts - now))});
      next = "<div class=\"next\"><span class=\"when\">" + when + "</span>" +
        (dueNow ? "<button class=\"btn due small\" type=\"button\" data-act=\"done\" data-id=\"" + id + "\">" + esc(t("reviewed")) + "</button>"
                : "<button class=\"btn small\" type=\"button\" data-act=\"done\" data-id=\"" + id + "\">" + esc(t("early")) + "</button>") + "</div>";
    }
    var lines = b.words ? b.words.split(/\n+/).filter(Boolean).length : 0;
    var words = b.words ? "<details class=\"words\" data-wid=\"" + id + "\"><summary>" + esc(t("viewWords", {n:lines})) + "</summary><p>" + esc(b.words) + "</p></details>" : "";
    var actions = state.pendingDelete === b.id
      ? "<span class=\"meta\">" + esc(t("confirmDel")) + "</span><button class=\"btn danger small\" type=\"button\" data-act=\"del-yes\" data-id=\"" + id + "\">" + esc(t("del")) + "</button><button class=\"btn small\" type=\"button\" data-act=\"del-no\" data-id=\"" + id + "\">" + esc(t("cancel")) + "</button>"
      : (c >= 0 ? "<button class=\"btn ghost small\" type=\"button\" data-act=\"ics\" data-id=\"" + id + "\">" + esc(t("ics")) + "</button>" : "") +
        "<button class=\"btn ghost small\" type=\"button\" data-act=\"del\" data-id=\"" + id + "\">" + esc(t("del")) + "</button>";
    var doneCount = b.done.filter(Boolean).length;
    var pill = c < 0 ? "<span class=\"pill done\">" + esc(t("pillDone")) + "</span>"
      : dueNow ? "<span class=\"pill due\">" + esc(t("pillDue")) + "</span>"
      : "<span class=\"pill\">" + esc(t("pillWait", {n:c+1})) + "</span>";
    return "<article class=\"batch" + (dueNow ? " is-due" : "") + "\">" +
      "<div class=\"batch-top\"><div><h3>" + esc(b.name) + "</h3><div class=\"meta\">" + esc(t("studiedAt", {t: fmtAbs(b.start), d: doneCount, n: b.done.length})) + "</div></div>" + pill + "</div>" +
      nodesHtml(b, now) + next + words + "<div class=\"batch-actions\">" + actions + "</div></article>";
  }
  function render(){
    var now = Date.now();
    var active = state.batches.filter(function(b){ return curStage(b) >= 0; }).sort(function(a, b){ return dueAt(a, curStage(a)) - dueAt(b, curStage(b)); });
    var finished = state.batches.filter(function(b){ return curStage(b) < 0; }).sort(function(a, b){ return b.start - a.start; });
    var h = "<div class=\"list-head\"><h2>" + esc(t("listHead")) + "</h2><span>" + esc(t("countActive", {n:active.length}) + (finished.length ? t("countDone", {n:finished.length}) : "")) + "</span></div>";
    h += active.length ? active.map(function(b){ return batchHtml(b, now); }).join("")
      : "<div class=\"empty\"><strong>" + esc(t("emptyTitle")) + "</strong>" + esc(t("emptyBody")) + "</div>";
    if (finished.length) h += "<details class=\"finished\"><summary>" + esc(t("finished", {n:finished.length})) + "</summary><div class=\"list\">" + finished.map(function(b){ return batchHtml(b, now); }).join("") + "</div></details>";
    var fin = document.querySelector("details.finished"), openFinished = fin && fin.open;
    var openWords = {}; [].forEach.call(document.querySelectorAll("#main details.words[open]"), function(d){ openWords[d.getAttribute("data-wid")] = 1; });
    $("main").innerHTML = h;
    if (openFinished) document.querySelector("details.finished").open = true;
    [].forEach.call(document.querySelectorAll("#main details.words"), function(d){ if (openWords[d.getAttribute("data-wid")]) d.open = true; });

    var due = dueList(now), bar = $("duebar");
    if (due.length){
      bar.hidden = false;
      bar.innerHTML = "<span>" + t("dueBar", {n:due.length, names: due.map(function(b){ return esc(b.name); }).join(L().sep)}) + "</span><button class=\"btn due small\" type=\"button\" data-act=\"open\">" + esc(t("openReminder")) + "</button>";
    } else bar.hidden = true;
  }

  /* ================= modal ================= */
  var modalSig = "";
  function closeModal(){ $("overlay").hidden = true; modalSig = ""; }
  function openModal(force){
    var now = Date.now(), list = dueList(now);
    if (!list.length){ closeModal(); return; }
    var sig = list.map(function(b){ return b.id + ":" + curStage(b); }).join("|");
    if (sig === modalSig && !$("overlay").hidden && !force) return;
    modalSig = sig;
    $("mTitle").textContent = list.length > 1 ? t("titleMany", {n:list.length}) : t("titleOne", {name:list[0].name});
    $("mBody").innerHTML = list.map(function(b){
      var i = curStage(b);
      var words = b.words ? "<details class=\"words\" open><summary>" + esc(t("mWords")) + "</summary><p>" + esc(b.words) + "</p></details>" : "";
      return "<div class=\"mitem\"><div class=\"mitem-top\"><div><h3>" + esc(b.name) + "</h3><div class=\"meta\">" +
        esc(t("mMeta", {n:i+1, label:stageLabel(planOf(b)[i]), t:fmtAbs(dueAt(b, i))})) + "</div></div>" +
        "<button class=\"btn primary small\" type=\"button\" data-act=\"done\" data-id=\"" + esc(b.id) + "\">" + esc(t("reviewed")) + "</button></div>" + words + "</div>";
    }).join("");
    $("overlay").hidden = false;
  }

  /* ================= clock ================= */
  function check(){
    var now = Date.now(), list = dueList(now);
    list.forEach(function(b){
      var i = curStage(b), key = b.id + ":" + i + ":" + (b.snooze || 0);
      if (!notified[key]){ notified[key] = 1; sysNotify(b, i); }
    });
    if (list.length) openModal(false); else closeModal();
    render();
  }
  var flash = false;
  setInterval(function(){
    var n = dueList(Date.now()).length;
    flash = n ? !flash : false;
    document.title = n && flash ? t("flash", {n:n}) : L().docTitle;
  }, 1500);
  setInterval(check, 10e3);
  setInterval(function(){ if (!startTouched){ $("bStart").value = toLocalInput(Date.now()); renderPreview(); } }, 30e3);
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) check(); });

  applyStatic(); check();
})();
</script>
</body>
</html>
